version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "PasswordFuerte123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - itm_network

  api:
    build: 
      context: .
      dockerfile: GestionITM.Api/Dockerfile
    ports:
      - "8080:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=GestionITM_Db;User Id=sa;Password=PasswordFuerte123!;TrustServerCertificate=True;
    depends_on:
      - db
    networks:
      - itm_network

networks:
  itm_network:
    driver: bridge